body{
margin:0;

background:#0b0b12;
color:white;

}

/* هدر */

header{
background:linear-gradient(90deg,#8a00ff,#ff00c8);
padding:25px;
box-shadow:0 0 20px #8a00ff;
}

header h1{
margin:0;
font-size:40px;
color:white;
text-shadow:0 0 15px #ff00c8;
}

/* منو */

nav{
background:#111;
padding:12px;
}

nav a{
color:#c46cff;
margin:15px;
text-decoration:none;
font-weight:bold;
}

nav a:hover{

}

/* عنوان */

h2{
color:#c46cff;
margin-top:40px;
text-shadow:0 0 10px #ff00c8;
}

/* لیست بازی */

.games{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
padding:30px;
}

/* کارت بازی */

.game{
background:#161620;
width:260px;
padding:15px;
border-radius:10px;
transition:0.3s;
border:1px solid #333;
}

.game:hover{
transform:translateY(-8px);
box-shadow:0 0 20px #8a00ff,0 0 10px #00ff88;
}

.game img{
width:100%;
border-radius:8px;
}

/* عنوان بازی */

.game h3{
color:#ff00c8;
margin:10px 0;
}

/* توضیح */

.game p{
font-size:14px;
color:#bbb;
}

/* دکمه */

.btn{
display:inline-block;
margin-top:10px;
padding:10px 20px;
background:linear-gradient(45deg,#8a00ff,#ff0055);
color:white;
text-decoration:none;
border-radius:20px;
}

.btn:hover{
box-shadow:0 0 15px #ff0055;
}

/* فوتر */

footer{
margin-top:40px;
padding:25px;
color:#777;
font-size:13px;
}
